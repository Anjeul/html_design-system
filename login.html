<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connexion - TechCorp RH</title>
    <meta
      name="Page de connexion"
      content="La page qui permet de se connecter à la plateforme RH."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/main.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <main class="auth">
      <div class="auth__aside">
        <img src="assets/logo.svg" alt="logo" class="logo logo--auth" />
        <p>Connectez vous sur la plateforme !</p>
      </div>
      <div class="auth__main">
        <div class="auth__panel">
          <h1>Connexion</h1>
          <p>Utilisez votre adresse e-mail professionnelle.</p>
          <form action="/login.html" method="post" id="login-form" class="form">
            <div class="form__field">
              <label for="email">Adresse e-mail</label>
              <input
                placeholder="mail-pro@mail.fr"
                type="email"
                class="input"
                id="email"
                name="email"
                autocomplete="email"
                required
              />
            </div>
            <div class="form__field">
              <label for="password">Mot de passe</label>
              <input
                placeholder="Mon mot de passe"
                type="password"
                class="input"
                id="password"
                name="password"
                autocomplete="current-password"
                required
              />
            </div>

            <label class="label-checkbox">
              <input type="checkbox" name="remember" />
              Se souvenir de moi
            </label>

            <button type="submit" class="btn btn--primary" disabled>
              Se connecter
            </button>
          </form>
          <p>
            <a href="inscription.html">Vous n'avez pas encore de compte ?</a>
          </p>
        </div>
      </div>
    </main>
    <footer class="footer">
      <a href="#">Mentions légales</a>
      <a href="#">Confidentialité</a>
      <a href="#">Accessibilité</a>
    </footer>
  </body>
</html>
